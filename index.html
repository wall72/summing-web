<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summing Web Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Summing Web Edition</h1>
            <div class="info-panel">
                <div class="info-item">
                    <span class="label">점수:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="info-item">
                    <span class="label">배치 횟수:</span>
                    <span id="moves" class="value">0</span>
                </div>
                <div class="info-item">
                    <span class="label">남은 타일:</span>
                    <span id="remaining" class="value">49</span>
                </div>
            </div>
        </header>

        <main>
            <div class="game-area">
                <div class="stream-panel">
                    <div class="stream-label">다음 숫자</div>
                    <div class="current-number" id="currentNumber">5</div>
                    <div class="upcoming-numbers">
                        <div class="stream-label-small">이후 숫자</div>
                        <div class="upcoming-list" id="upcomingNumbers">
                            <span class="upcoming-number">3</span>
                            <span class="upcoming-number">7</span>
                            <span class="upcoming-number">2</span>
                        </div>
                    </div>
                </div>

                <div class="board-container">
                    <div id="board" class="board"></div>
                    <div id="gameStatus" class="game-status hidden"></div>
                </div>
            </div>

            <div class="controls">
                <button id="newGameBtn" class="btn btn-primary">새 게임</button>
                <button id="pauseBtn" class="btn btn-secondary hidden">일시정지</button>
            </div>

            <div class="records-panel">
                <h3>기록</h3>
                <div class="record-item">
                    <span class="record-label">최고 점수:</span>
                    <span id="highScore" class="record-value">0</span>
                </div>
                <div class="record-item">
                    <span class="record-label">최소 배치 횟수:</span>
                    <span id="bestMoves" class="record-value">-</span>
                </div>
            </div>
        </main>
    </div>

    <div id="overlay" class="overlay hidden">
        <div class="modal">
            <h2 id="modalTitle">게임 종료</h2>
            <p id="modalMessage"></p>
            <button id="modalCloseBtn" class="btn btn-primary">확인</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
