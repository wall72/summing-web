<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Summing Mobile</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="gameScreen" class="screen">
        <div class="game-container">
            <header class="game-header">
                <h1>Summing Mobile</h1>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Score</span>
                        <span id="score" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Moves</span>
                        <span id="moves" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Tiles</span>
                        <span id="remaining" class="stat-value">49</span>
                    </div>
                </div>
            </header>

            <div id="status" class="sr-only" aria-live="polite"></div>

            <div class="game-content">
                <div class="stream-horizontal">
                    <div class="stream-label">Next Numbers</div>
                    <div class="stream-numbers" id="streamNumbers">
                        <span class="stream-num current">5</span>
                        <span class="stream-num">3</span>
                        <span class="stream-num">7</span>
                        <span class="stream-num">2</span>
                        <span class="stream-num">8</span>
                    </div>
                </div>

                <div class="board-wrapper">
                    <div id="board" class="board"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="leaderboardScreen" class="screen hidden">
        <div class="leaderboard-container">
            <header class="leaderboard-header">
                <h1>Leaderboard</h1>
            </header>

            <div class="game-result" id="gameResult">
                <h2 id="resultTitle">Game Finished</h2>
                <div class="result-stats">
                    <div class="result-item">
                        <span class="result-label">Final Score</span>
                        <span id="finalScore" class="result-value">0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Moves</span>
                        <span id="finalMoves" class="result-value">0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Remaining Tiles</span>
                        <span id="finalRemaining" class="result-value">0</span>
                    </div>
                </div>
            </div>

            <div class="leaderboard-list">
                <h3>Top Records</h3>
                <div id="leaderboardEntries" class="entries"></div>
            </div>

            <div class="leaderboard-actions">
                <button id="newGameBtn" class="btn btn-primary">New Game</button>
            </div>
        </div>
    </div>

    <script src="logic.js"></script>
    <script src="game.js"></script>
</body>
</html>
